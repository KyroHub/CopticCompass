version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      supabase:
        applies-to: version-updates
        patterns:
          - "@supabase/*"
      ai-sdk:
        applies-to: version-updates
        patterns:
          - "ai"
          - "@ai-sdk/*"
      next-stack:
        applies-to: version-updates
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      dev-tooling:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
